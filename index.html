<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>साधक</title>

<style>
  .hero{
  position:relative;
  overflow:hidden;
}

.hero-img{
  width:100%;
  height:100%;
  object-fit:cover;
  position:absolute;
  inset:0;
  z-index:0;
}

.hero h1,.hero p,.hero button{
  position:relative;
  z-index:1;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#fff;color:#5a280f}

header{
background:#a90000;color:white;
padding:22px 7%;
display:flex;align-items:center;
justify-content:space-between;
}
.logo{font-size:48px;font-weight:bold}
nav{display:flex;gap:28px;font-size:22px}
nav a{color:white;text-decoration:none}
.menu{font-size:35px}

.hero{
  position:relative;
  height:600px;
  overflow:hidden;
  background:#f5e6c8;
}


.content{max-width:560px}
h2{font-size:55px;line-height:1.2}
p{font-size:25px;margin:30px 0}

button{
background:#b00000;color:white;
border:0;border-radius:22px;
padding:18px 55px;
font-size:25px;
}
@media(max-width:700px){
.logo{font-size:40px}
nav a{display:none}
.hero{min-height:650px;padding:60px 25px}
h2{font-size:43px}
p{font-size:21px}
}
</style>
</head>

<body>

<header>
<div class="logo">साधक</div>

<nav>
<a href="#">होम</a>
<a href="#">कथा</a>
<a href="#">ज्ञान</a>
<a href="#">संपर्क</a>
</nav>

<div class="menu">☰</div>
</header>

<section class="hero">
  <img src="hero.jpg" class="hero-img">
<div class="content">
<h2>आध्यात्मिक<br>ज्ञान की यात्रा</h2>

<p>धर्म • भक्ति • ज्ञान • प्रेरणा</p>

<button>शुरू करें ›</button>
</div>
</section>

</body>
</html>
