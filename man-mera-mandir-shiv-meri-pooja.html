<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>ॐ नमः शिवाय | शिव भजन</title>

<style>
  .shiv-image{
  width:100%;
  margin:25px 0;
}

.shiv-image img{
  width:100%;
  height:auto;
  display:block;
  border-radius:20px;
}
*{box-sizing:border-box}

body{
margin:0;
font-family:"Noto Sans Devanagari",Arial,sans-serif;
background:radial-gradient(circle at top,#fff4d6 0,#f5d39b 45%,#e7b86e 100%);
color:#4b2100;
}

header{
background:linear-gradient(135deg,#5b0000,#a40000,#6d0000);
color:white;
text-align:center;
padding:28px 15px;
position:relative;
overflow:hidden;
}

header:before,header:after{
content:"ॐ";
position:absolute;
font-size:90px;
opacity:.08;
top:5px;
}

header:before{left:10px}
header:after{right:10px}

.om-symbol{
font-size:55px;
color:#ffd36a;
text-shadow:0 2px 8px #000;
}

header h1{
margin:5px 0;
font-size:32px;
}

header p{
margin:5px 0 0;
color:#ffe9b0;
font-size:16px;
}

.container{
max-width:760px;
margin:28px auto;
padding:0 15px;
}

.title-card{
background:rgba(255,250,238,.95);
border:1px solid #d99a38;
border-radius:24px;
padding:24px 18px;
text-align:center;
box-shadow:0 8px 25px #5b270033;
}

.title-card h2{
margin:0;
color:#8b0000;
font-size:28px;
}

.title-card .line{
width:100px;
height:3px;
background:#d28a18;
margin:12px auto;
border-radius:10px;
}

  .shiv-image{
  width:100%;
  margin:25px 0;
  padding:0;
}

.shiv-image img{
  width:100%;
  max-width:none;
  height:auto;
  display:block;
  border-radius:0;
}

.audio-card{
margin-top:20px;
background:linear-gradient(135deg,#fff9ed,#f9dfac);
border-radius:20px;
padding:20px;
border:1px solid #d99a38;
box-shadow:0 6px 18px #5b270022;
}

.audio-title{
font-weight:bold;
font-size:19px;
color:#7b2500;
margin-bottom:12px;
}

audio{
width:100%;
height:45px;
}

.download{
display:block;
text-align:center;
margin-top:14px;
padding:13px;
background:linear-gradient(135deg,#8b0000,#b51d00);
color:white;
text-decoration:none;
border-radius:12px;
font-weight:bold;
box-shadow:0 4px 10px #5b000044;
}

footer{
margin-top:35px;
background:linear-gradient(135deg,#5b0000,#8b0000);
color:#ffe7aa;
text-align:center;
padding:22px 10px;
font-size:17px;
}

@media(max-width:600px){
header h1{font-size:27px}
.container{padding:0 10px}
.title-card,.audio-card{border-radius:18px}
.om-symbol{font-size:48px}
}
</style>
</head>

<body>

<header>

<div class="om-symbol">ॐ</div>

<h1>मन मेरा मंदिर शिव मेरी पूजा</h1>

<p>मन मेरा मंदिर शिव मेरी पूजा 🔱</p>

</header>

<div class="container">

<div class="title-card">

<h2>🔱 शिव भजन</h2>

<div class="line"></div>

<p>भोलेनाथ की भक्ति में समर्पित</p>

</div>

  <div class="shiv-image">
<img src="shivji.jpg" alt="भगवान शिव">
  </div>


<div class="audio-card">

<div class="audio-title">
🎵 भजन सुनें
</div>

<audio controls>
<source src="audio/om-namah-shivay.mp3" type="audio/mpeg">

</audio>

</a>

</div>

<footer>
🔱 हर हर महादेव 🔱<br>
ॐ नमः शिवाय
</footer>

</div>

</body>
</html>
